name: HA integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Home Assistant 2026.10.1 requires Python 3.14.2 or newer.
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: ruff, ruff format and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test requirements
        run: python -m pip install -r requirements_test.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy (strict) on custom_components
        run: mypy custom_components

  tests:
    name: pytest with a 95 percent coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test requirements
        run: python -m pip install -r requirements_test.txt
      - name: Look for HA test files
        id: detect
        run: |
          if find tests -name 'test_*.py' -print -quit | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi
      - name: pytest tests/ (coverage must be at least 95 percent)
        if: steps.detect.outputs.has_tests == 'true'
        run: >-
          pytest tests/
          --cov=custom_components/ros2_bridge
          --cov-report=term-missing
          --cov-fail-under=95
      - name: Coverage gate skipped
        if: steps.detect.outputs.has_tests == 'false'
        run: >-
          echo "No test files under tests/ yet, so the 95 percent coverage gate is skipped
          (the HA suite arrives in phase 3)."

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # Custom integrations are not listed in home-assistant/brands; the HACS brand
          # asset is brand/icon.png, so the brands check is ignored.
          ignore: brands
