#
# Local broker for the compose "local-broker" profile: CI and offline use only.
# Anonymous access, no TLS, no persistence. The listener is reachable only on the compose
# network (the service publishes no host port). A real deployment uses the broker that Home
# Assistant already uses; this file is never a template for one.

listener 1883
allow_anonymous true
persistence false
log_dest stdout
log_timestamp true
