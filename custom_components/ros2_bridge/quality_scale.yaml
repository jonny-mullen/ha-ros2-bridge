# Integration quality scale record for ros2_bridge (custom integration, HACS).
#
# Every rule of script/hassfest/quality_scale.py at Home Assistant 2026.10.1 is listed
# (20 Bronze, 10 Silver, 21 Gold, 3 Platinum; the names were taken from the union of the
# quality_scale.yaml files shipped with the core integrations of that release). A rule is
# done only when the evidence exists in this tree, and each docs-* rule names the page and
# section that carries it (updated 2026-10-14); a rule whose evidence does not exist yet is
# todo with the reason. Exemptions carry the reason.
rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: >
      Push integration (iot_class local_push). Every entity sets _attr_should_poll = False and
      updates from dispatcher signals the MQTT hub sends; nothing polls.
  brands:
    status: exempt
    comment: >
      The rule refers to the home-assistant/brands repository, which custom integrations do
      not use. The HACS brand asset ships as brand/icon.png in this repository.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: >
      The integration has no pip requirements; it rides the mqtt integration's own client.
  docs-actions:
    status: done
    comment: >
      docs/install-ha.md, section 5 "Actions (services)": send_task, cancel_task and
      get_robots with their fields, responses and YAML examples.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions:
    status: done
    comment: >
      docs/install-ha.md, sections 1 and 2: install through HACS or by copying the folder,
      then add by discovery or by hand.
  docs-removal-instructions:
    status: done
    comment: >
      docs/install-ha.md, section 9 "Uninstalling": the robots' retained topics, deleting the
      entry (which clears its sensor topics and store) and removing the files.
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers; automations use the bus events.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: >
      The user step aborts when the MQTT integration is not configured or its client does not
      become available; the broker itself is tested by the mqtt integration.
  test-before-setup:
    status: done
    comment: async_setup_entry raises ConfigEntryNotReady while the MQTT client is unavailable.
  unique-config-entry:
    status: exempt
    comment: single_config_entry is set in the manifest; Home Assistant allows one entry.

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: >
      docs/install-ha.md, section 3 "Options": every option with its range, default and
      effect. docs/configuration.md is the matching reference for the ROS 2 node.
  docs-installation-parameters:
    status: done
    comment: >
      docs/install-ha.md, section 2 "Adding it by hand": the topic prefix and the optional
      shared secret, the only two fields the flow asks for (the broker comes from the mqtt
      integration).
  entity-unavailable: done
  integration-owner:
    status: todo
    comment: >
      codeowners holds a placeholder until the public repository exists (decisions.md, open
      question b).
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: >
      The integration holds no credentials of its own; the broker credentials belong to the
      mqtt integration and the optional shared secret is an option, not an authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: done
    comment: MQTT discovery on ros2_bridge/+/announce (manifest mqtt key).
  discovery-update-info:
    status: exempt
    comment: >
      Robots have no network address to update; everything reaches them through the broker
      the mqtt integration is already connected to.
  docs-data-update:
    status: done
    comment: >
      docs/install-ha.md, section 4 "What appears for each robot": entities update from the
      robot's retained state, availability and heartbeat messages, with the unavailability
      rules; docs/architecture.md describes the push model and the data flows.
  docs-examples:
    status: done
    comment: >
      docs/examples/automations.yaml (kitchen idle, speak-back, notification),
      docs/examples/sentence_trigger_automation.yaml, docs/examples/custom_sentences/en/
      ros2_bridge.yaml, plus the YAML examples in docs/install-ha.md sections 5 and 6.
  docs-known-limitations:
    status: done
    comment: >
      docs/failure-modes.md (every failure mode, what HA shows, and the rows with no test
      yet), docs/assist.md "Limits", docs/install-ha.md (discovery only on the default
      prefix) and SECURITY.md (the broker ACL gap).
  docs-supported-devices:
    status: done
    comment: >
      docs/install-ha.md, opening paragraphs: any robot running ros2_ha_bridge works,
      including one running the shipped fake executor; the executor plugin, not the
      integration, decides which arms are driven.
  docs-supported-functions:
    status: done
    comment: >
      docs/install-ha.md, sections 4 to 8: the entities, the three actions, the bus events,
      the repairs and the voice intents.
  docs-troubleshooting:
    status: done
    comment: >
      docs/troubleshooting.md: symptom to cause, rejection codes, the no_ack outcome, the
      repairs, reading the diagnostics, watching the topics, where the logs are.
  docs-use-cases:
    status: done
    comment: >
      docs/sensors.md (the kitchen idle scenario, both sensor paths), docs/assist.md (voice),
      docs/install-ha.md sections 5 and 6 and docs/examples/automations.yaml.
  dynamic-devices: done
  entity-category:
    status: exempt
    comment: >
      Every entity is a primary feature of the robot (state, last result, problem, task result,
      task buttons); none is configuration or diagnostic.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: The entity set is small and every one is used by the kitchen scenario; none is noisy.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: >
      The entry's only data is a generated instance id; everything a user may change is an
      option edited through the options flow.
  repair-issues: done
  stale-devices:
    status: done
    comment: >
      A robot's tombstone (empty retained announce) removes its device; a user may delete an
      offline robot's device, which clears its retained topics.

  # Platinum
  async-dependency:
    status: exempt
    comment: No dependency of its own; the mqtt integration's client is already asynchronous.
  inject-websession:
    status: exempt
    comment: The integration makes no HTTP requests.
  strict-typing: done
